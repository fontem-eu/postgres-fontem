name: build-sign-push

# Manual dispatch or a v* tag: a Postgres or pgvector upgrade is a
# deliberate decision, not an auto-bump. Renovate flags the base digest, a
# human fires this workflow with the new tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, e.g. 16.15-pgv0.8.1'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      # Before anything is pushed: a fresh volume initialises, and the server
      # starts on a data directory with the permissions a kubelet fsGroup
      # leaves (the 2026-09-30 prod crash loop). docker-build-sign's build
      # below reuses these layers.
      - name: Smoke test the image
        run: |
          docker build --network host -t postgres-fontem-smoke:${{ github.run_id }} .
          test/smoke.sh postgres-fontem-smoke:${{ github.run_id }}

      # The build path every image takes: push, sign, attest the SBOM and
      # SLSA provenance by digest, and check the runtime image. Postgres
      # keeps a shell: the entrypoint is bash (initdb on an empty volume)
      # and the psql client Jobs run `sh -c` scripts; busybox brings wget
      # along as an applet. Anything else fails the build.
      - id: image
        name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/postgres-fontem
          tag: ${{ steps.tag.outputs.value }}
          vault-role-id: ${{ secrets.VAULT_SIGNER_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SIGNER_SECRET_ID }}
          sbom-coverage: enforce
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          minimal-allow: "shell wget"
          minimal-enforce: "true"
